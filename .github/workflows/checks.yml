name: Checks

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  python-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  recommendation-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run convex/lib/catalogExportAuth.test.ts convex/lib/recommendations/catalogExport.test.ts convex/lib/recommendations/contentSnapshot.test.ts convex/lib/recommendations/mlStrategy.test.ts

  python-ai-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ecommerce-ai-service:ci services/ai-service
