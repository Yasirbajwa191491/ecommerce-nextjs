services:
  ollama:
    image: ollama/ollama@${OLLAMA_IMAGE_DIGEST:?set a reviewed sha256 image digest}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  review-ai-worker:
    build:
      context: ./services/review-ai-worker
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      PORT: 3100
      WORKER_HOST: 0.0.0.0
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      AI_WORKER_SECRET: ${AI_WORKER_SECRET:?configure a unique secret of at least 32 characters}
      TRANSFORMERS_CACHE: /app/.cache
      AI_MODEL_ROOT: /app/models
    volumes:
      - transformers_cache:/app/.cache
      - ${AI_MODEL_DIRECTORY:?set reviewed local model directory}:/app/models:ro
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  transformers_cache:
